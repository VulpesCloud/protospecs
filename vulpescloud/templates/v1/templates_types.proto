syntax = "proto3";

package vulpescloud.templates.v1;

option java_multiple_files = true;
option java_package = "de.vulpescloud.proto.templates.v1";

message TemplateDefinition {
  string id = 1;
  string name = 2;
  int32 weight = 3;
  TemplateLocation location = 4;
  string version = 5;
  bool enabled = 6;
}

message TemplateLocation {
  string storage_name = 1;
  optional string node_name = 2;
}

message TemplateStorageType {
  string name = 1;
}

message TemplateStorage {
  string name = 1;
  TemplateStorageType type = 2;
  optional string node_name = 3;
}

message TemplateReference {
  string template_id = 1;
  string name = 2;
  TemplateLocation location = 3;
}

message TemplateFile {
  string path = 1;
  bytes content = 2;
  int64 size = 3;
  string mime_type = 4;
  int64 modified_at = 5;
}

message TemplateDirectoryEntry {
  string name = 1;
  string path = 2;
  bool directory = 3;
  int64 size = 4;
  int64 modified_at = 5;
}

message TemplateOperationResult {
  bool success = 1;
  string message = 2;
}

// --- Job System ---

enum TemplateJobStatus {
  TEMPLATE_JOB_STATUS_UNSPECIFIED = 0;
  TEMPLATE_JOB_STATUS_PENDING = 1;
  TEMPLATE_JOB_STATUS_IN_PROGRESS = 2;
  TEMPLATE_JOB_STATUS_COMPLETED = 3;
  TEMPLATE_JOB_STATUS_CANCELLED = 4;
  TEMPLATE_JOB_STATUS_FAILED = 5;
}

enum TemplateJobType {
  TEMPLATE_JOB_TYPE_UNSPECIFIED = 0;
  TEMPLATE_JOB_TYPE_COPY = 1;
  TEMPLATE_JOB_TYPE_MOVE = 2;
}

enum TemplateJobConflictMode {
  TEMPLATE_JOB_CONFLICT_MODE_UNSPECIFIED = 0;
  TEMPLATE_JOB_CONFLICT_MODE_DENY = 1;
  TEMPLATE_JOB_CONFLICT_MODE_SKIP = 2;
  TEMPLATE_JOB_CONFLICT_MODE_OVERWRITE = 3;
  TEMPLATE_JOB_CONFLICT_MODE_OVERWRITE_NEWER = 4;
  TEMPLATE_JOB_CONFLICT_MODE_OVERWRITE_CHANGED = 5;
}

enum TemplateJobExtraFilesMode {
  TEMPLATE_JOB_EXTRA_FILES_MODE_UNSPECIFIED = 0;
  TEMPLATE_JOB_EXTRA_FILES_MODE_KEEP = 1;
  TEMPLATE_JOB_EXTRA_FILES_MODE_PURGE = 2;
}

enum TemplateJobAcceptStatus {
  TEMPLATE_JOB_ACCEPT_STATUS_UNSPECIFIED = 0;
  TEMPLATE_JOB_ACCEPT_STATUS_ACCEPTED = 1;
  TEMPLATE_JOB_ACCEPT_STATUS_REJECTED_SOURCE_NOT_FOUND = 2;
  TEMPLATE_JOB_ACCEPT_STATUS_REJECTED_DESTINATION_EXISTS = 3;
  TEMPLATE_JOB_ACCEPT_STATUS_REJECTED_FILES_CONFLICT = 4;
  TEMPLATE_JOB_ACCEPT_STATUS_REJECTED_INVALID_CONFIGURATION = 5;
}

enum TemplateJobPhase {
  TEMPLATE_JOB_PHASE_UNSPECIFIED = 0;
  TEMPLATE_JOB_PHASE_ACCEPTED = 1;
  TEMPLATE_JOB_PHASE_SCANNING_SOURCE = 2;
  TEMPLATE_JOB_PHASE_SCANNING_DESTINATION = 3;
  TEMPLATE_JOB_PHASE_PREPARING_DESTINATION = 4;
  TEMPLATE_JOB_PHASE_COPYING_FILES = 5;
  TEMPLATE_JOB_PHASE_PURGING_DESTINATION = 6;
  TEMPLATE_JOB_PHASE_VERIFYING_CHECKPOINT = 7;
  TEMPLATE_JOB_PHASE_DELETING_SOURCE = 8;
}

message TemplateFileChunk {
  int64 offset = 1;
  int64 totalSize = 2;
  int64 modifiedAt = 3;
  bytes content = 4;
  bool finalChunk = 5;
}

message TemplateJobProgress {
  string jobId = 1;
  TemplateJobType type = 2;
  TemplateJobStatus status = 3;

  TemplateReference source = 4;
  TemplateReference destination = 5;

  TemplateJobConflictMode conflictMode = 6;
  TemplateJobExtraFilesMode extraFilesMode = 7;

  int32 totalFiles = 8;
  int32 filesProcessed = 9;
  int64 bytesProcessed = 10;
  int64 totalBytes = 11;
  string currentFile = 12;

  int32 filesCopied = 13;
  int32 filesSkipped = 14;
  int32 filesOverwritten = 15;
  int32 filesPurged = 16;

  int64 startedAt = 17;
  int64 completedAt = 18;

  string failureReason = 19;

  TemplateJobPhase phase = 20;
}

message TemplateJobAcceptResponse {
  TemplateJobAcceptStatus status = 1;
  string reason = 2;
  TemplateJobProgress job = 3;
}

message GetTemplateJobRequest {
  string jobId = 1;
}

message ListActiveTemplateJobsResponse {
  repeated TemplateJobProgress jobs = 1;
}

message CancelTemplateJobRequest {
  string jobId = 1;
}

message CancelTemplateJobResponse {
  bool success = 1;
  string message = 2;
}

message ListTemplateJobsRequest {
  // UNSPECIFIED means all retained jobs.
  TemplateJobStatus statusFilter = 1;
}

message ListTemplateJobsResponse {
  repeated TemplateJobProgress jobs = 1;
}

message StreamReadFileChunksRequest {
  TemplateReference template = 1;
  string path = 2;
  // The server should cap this at a small size, such as 1 MiB.
  int32 chunkSize = 3;
}

message StreamWriteFileChunksRequest {
  TemplateReference template = 1;
  string path = 2;
  int64 totalSize = 3;
  int64 offset = 4;
  int64 modifiedAt = 5;
  bytes content = 6;
  bool finalChunk = 7;
}