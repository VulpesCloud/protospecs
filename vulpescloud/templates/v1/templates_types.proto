syntax = "proto3";

package vulpescloud.templates.v1;

option java_multiple_files = true;
option java_package = "de.vulpescloud.proto.templates.v1";

message TemplateDefinition {
  string id = 1;
  string name = 2;
  int32 weight = 3;
  TemplateLocation location = 4;
  string version = 5;
  bool enabled = 6;
}

message TemplateLocation {
  string storage_name = 1;
  optional string node_name = 2;
}

message TemplateStorageType {
  string name = 1;
}

message TemplateStorage {
  string name = 1;
  TemplateStorageType type = 2;
  optional string node_name = 3;
}

message TemplateReference {
  string template_id = 1;
  string name = 2;
  TemplateLocation location = 3;
}

message TemplateFile {
  string path = 1;
  bytes content = 2;
  int64 size = 3;
  string mime_type = 4;
  int64 modified_at = 5;
}

message TemplateDirectoryEntry {
  string name = 1;
  string path = 2;
  bool directory = 3;
  int64 size = 4;
  int64 modified_at = 5;
}

message TemplateOperationResult {
  bool success = 1;
  string message = 2;
}
