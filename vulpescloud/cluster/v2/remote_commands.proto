syntax = "proto3";

package vulpescloud.cluster.v2;

option java_multiple_files = true;
option java_package = "de.vulpescloud.proto.cluster.v2";

message PlayerCommandSource {
  string player_name = 1;
  string player_uuid = 2;
  string player_proxy_service_name = 3;
  string player_server_service_name = 4;
}

message UserCommandSource {
  string username = 1;
  map<string, string> extra_data = 2;
}

message ExecuteCommandRequest {
  oneof source {
    PlayerCommandSource player_source = 1;
    UserCommandSource user_source = 2;
  }
  string command = 3;
}

message ExecuteCommandResponse {
  bool success = 1;
  repeated string output = 2;
}

message TabCompleteRequest {
  oneof source {
    PlayerCommandSource player_source = 1;
    UserCommandSource user_source = 2;
  }
  string command = 3;
}

message TabCompleteResponse {
  repeated string suggestions = 1;
}

service RemoteCommandService {
  rpc ExecuteCommand(ExecuteCommandRequest) returns (ExecuteCommandResponse);
  rpc TabComplete(TabCompleteRequest) returns (TabCompleteResponse);
}
