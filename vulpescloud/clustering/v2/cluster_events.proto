syntax = "proto3";

package vulpescloud.cluster.v2;

option java_multiple_files = true;
option java_package = "de.vulpescloud.proto.cluster.v2";

import "vulpescloud/clustering/v2/cluster_types.proto";
import "vulpescloud/draining/v1/draining_api.proto";

message NodeStateChangeEvent {
    NodeSnapshot snapshot = 1;
    NodeState old_state = 2;
    NodeState new_state = 3;
}
 
message NodeDrainStartedEvent {
  NodeSnapshot snapshot = 1;
  vulpescloud.draining.v1.NodeDrainStrategy strategy = 2;
}

message NodeDrainProgressEvent {
  NodeSnapshot snapshot = 1;
  int32 services_remaining = 2;
  int32 players_remaining = 3;
}

message NodeDrainCompletedEvent {
  NodeSnapshot snapshot = 1;
}

message NodeDrainCancelledEvent {
  NodeSnapshot snapshot = 1;
}

message NodeDrainFailedEvent {
  NodeSnapshot snapshot = 1;
  string reason = 2;
}

message NodeMaintenanceChangedEvent {
  NodeSnapshot snapshot = 1;
  bool enabled = 2;
}