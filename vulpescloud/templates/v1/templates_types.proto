syntax = "proto3";

package vulpescloud.templates.v1;

option java_multiple_files = true;
option java_package = "de.vulpescloud.proto.templates.v1";

message TemplateDefinition {
  string id = 1;
  string name = 2;
  TemplateStorage storage = 3;
  int32 weight = 4;
  TemplateLocation location = 5;
  string version = 6;
  bool enabled = 7;
}

enum TemplateStorage {
  TEMPLATE_STORAGE_UNSPECIFIED = 0;
  TEMPLATE_STORAGE_LOCAL = 1;
  TEMPLATE_STORAGE_S3 = 2;
}

message TemplateLocation {
  TemplateStorage storage = 1;
  string node_id = 2;
  string storage_name = 3;
  string path = 4;
}

message TemplateReference {
  string template_id = 1;
  string name = 2;
  TemplateLocation location = 3;
}

message TemplateFile {
  string path = 1;
  bytes content = 2;
  int64 size = 3;
  string mime_type = 4;
  int64 modified_at = 5;
}

message TemplateDirectoryEntry {
  string name = 1;
  string path = 2;
  bool directory = 3;
  int64 size = 4;
  int64 modified_at = 5;
}

message TemplateOperationResult {
  bool success = 1;
  string message = 2;
}
